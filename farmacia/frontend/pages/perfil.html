
<div class="perfil-contenido">

    <h1>Mi perfil</h1>
    <p>Información de tu cuenta y opciones de usuario.</p>

    <div class="perfil-grid">

        <!-- Resumen del perfil -->
        <div class="tarjeta perfil-resumen">

            <img class="perfil-foto"
                 id="perfilFoto"
                 src="images/profile.jpg"
                 alt="Foto de perfil">

            <h3 id="perfilNombre">Tu nombre</h3>
            <p id="perfilCorreo">Agrega tu correo</p>

            <label class="boton boton-secundario">
                Cambiar foto
                <input type="file"
                       id="inputFoto"
                       class="solo-lector"
                       accept="image/png, image/jpeg, image/webp">
            </label>

            <div class="perfil-accesos">
                <button type="button" data-ir="historial">
                    Historial de compras
                </button>

                <button type="button" data-ir="favoritos">
                    Mis favoritos
                </button>

                <button type="button" data-ir="membresia">
                    Mi membresía
                </button>
            </div>

        </div>

        <!-- Formulario de perfil -->
        <form class="tarjeta" id="formPerfil">

            <fieldset id="camposPerfil" disabled>

                <legend>Datos personales</legend>

                <div class="campos">

                    <label class="campo campo-ancho">
                        <span>Nombre completo</span>
                        <input type="text" name="nombre"
                               maxlength="80" required>
                    </label>

                    <label class="campo">
                        <span>Correo electrónico</span>
                        <input type="email" name="correo"
                               maxlength="100" required>
                    </label>

                    <label class="campo">
                        <span>Teléfono (10 dígitos)</span>
                        <input type="tel" name="telefono"
                               pattern="[0-9]{10}" maxlength="10">
                    </label>

                    <label class="campo">
                        <span>Fecha de nacimiento</span>
                        <input type="date" name="nacimiento">
                    </label>

                    <label class="campo">
                        <span>Contraseña</span>

                        <div class="contenedor-password">
                            <input type="password"
                                   name="password"
                                   id="passwordPerfil"
                                   maxlength="50"
                                   placeholder="********">

                            <button type="button"
                                    class="toggle-password"
                                    id="botonVerPassword">
                                👁
                            </button>
                        </div>
                    </label>

                </div>

                <h4>Dirección de entrega</h4>

                <div class="campos">

                    <label class="campo campo-ancho">
                        <span>Calle y número</span>
                        <input type="text" name="calle" maxlength="120">
                    </label>

                    <label class="campo">
                        <span>Colonia</span>
                        <input type="text" name="colonia" maxlength="80">
                    </label>

                    <label class="campo">
                        <span>Código postal</span>
                        <input type="text" name="cp"
                               pattern="[0-9]{5}" maxlength="5">
                    </label>

                    <label class="campo">
                        <span>Ciudad</span>
                        <input type="text" name="ciudad" maxlength="60">
                    </label>

                    <label class="campo">
                        <span>Estado</span>
                        <input type="text" name="estado" maxlength="60">
                    </label>

                </div>

            </fieldset>

            <!-- Botones -->
            <div class="perfil-botones">

                <button type="button" class="boton" id="botonEditar">
                    Editar
                </button>

                <button type="button"
                        class="boton boton-secundario"
                        id="botonCancelar" hidden>
                    Cancelar
                </button>

                <button type="submit"
                        class="boton"
                        id="botonGuardar" hidden>
                    Guardar cambios
                </button>

                <p id="mensajePerfil" class="perfil-mensaje"></p>

            </div>

        </form>

    </div>
</div>
