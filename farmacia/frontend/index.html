
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmacia</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Barra superior -->
    <header class="barra-superior">

        <button class="boton-icono" aria-label="Inicio">
            <img src="images/placeholder.jpg" alt="Inicio">
        </button>

        <div class="botones-derecha">

            <button aria-label="Carrito">
                <img src="images/cart.jpg" alt="Carrito">
            </button>

            <button aria-label="Perfil">
                <img src="images/profile.jpg" alt="Perfil">
            </button>

        </div>

    </header>

    <!-- Contenido principal -->
    <main>

        <h1>Farmacia</h1>

        <input
            type="text"
            placeholder="Buscar medicamentos..."
        >

        <section class="catalogo">
    <h2>Medicamentos</h2>

    <div class="productos">
        <div class="producto">
            <img src="imagenes/placeholder.jpg" alt="Medicamento">
            <h3>Paracetamol</h3>
            <p>$35.00</p>
            <button>Agregar al carrito</button>
        </div>

        <div class="producto">
            <img src="imagenes/placeholder.jpg" alt="Medicamento">
            <h3>Ibuprofeno</h3>
            <p>$45.00</p>
            <button>Agregar al carrito</button>
        </div>

        <div class="producto">
            <img src="imagenes/placeholder.jpg" alt="Medicamento">
            <h3>Loratadina</h3>
            <p>$28.00</p>
            <button>Agregar al carrito</button>
        </div>
    </div>
</section>

    </main>

    <script src="script.js"></script>

</body>
</html>
