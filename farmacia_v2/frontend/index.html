<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="CureXpress">CureXpress</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app">

        <!-- Contenido principal -->
        <div class="contenido">

            <main class="contenido-principal">

                <section class="vista activa" id="inicio">
                    <h1 data-i18n="bienvenida">Bienvenido a nuestra farmacia</h1>
                    <p data-i18n="subBienvenida">Encuentra los productos que necesitas.</p>

                    <h2 data-i18n="destacados">Productos destacados</h2>

                    <div class="productos">
                        <div class="producto">
                            <img src="images/placeholder.jpg" alt="Paracetamol">
                            <h3 data-i18n="paracetamol">Paracetamol</h3>
                            <p>$35.00</p>
                            <button type="button" data-i18n="agregarCarrito">Agregar al carrito</button>
                        </div>

                        <div class="producto">
                            <img src="images/placeholder.jpg" alt="Ibuprofeno">
                            <h3 data-i18n="ibuprofeno">Ibuprofeno</h3>
                            <p>$45.00</p>
                            <button type="button" data-i18n="agregarCarrito">Agregar al carrito</button>
                        </div>

                        <div class="producto">
                            <img src="images/placeholder.jpg" alt="Loratadina">
                            <h3 data-i18n="loratadina">Loratadina</h3>
                            <p>$28.00</p>
                            <button type="button" data-i18n="agregarCarrito">Agregar al carrito</button>
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <script src="layout.js"></script>
    <script src="script.js"></script>
</body>
</html>
